[package]
name = "wayvrctl"
version = "26.8.0"
edition = "2024"
description = "CLI for controlling WayVR"
license = "GPL-3.0-only"
authors = ["galister", "oo8dev"]
repository = "https://github.com/wlx-team/wayvr"

[dependencies]
wayvr-ipc = { path = "../wayvr-ipc" }

anyhow.workspace = true
clap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
libc.workspace = true
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

env_logger = "0.11.11"
shell-words = "1.1.1"
